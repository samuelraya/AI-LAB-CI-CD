# Generated by developer-kit/setup-cicd; rerun it to update this file. Project: __PROJECT__
# Trigger: every push to main, including merged pull requests. Pull requests only run tests.
# Project repo files:
#   .cicd/start.sh        REQUIRED: starts the app on $PORT (and $PORT_2/$PORT_3 if assigned; run by the VM service)
#   .cicd/test.sh         tests on GitHub's machine before deploy
#   .cicd/post-deploy.sh  runs on the VM in the new release before it goes live
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run tests
        run: |
          if [ -f .cicd/test.sh ]; then bash .cicd/test.sh; else echo "No .cicd/test.sh, skipping tests."; fi

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, __PROJECT__]
    env:
      TARGET: /srv/projects/__PROJECT__
      SERVICE: app-__PROJECT__.service
      RUNTIME_ENV: /etc/projects/__PROJECT__.env
      KEEP_RELEASES: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy, restart and check port
        run: |
          set -euo pipefail
          umask 0007
          ports="$(sed -n 's/^PORT\(_[23]\)\{0,1\}=//p' "$RUNTIME_ENV" | tr '\n' ' ')"
          previous=""
          if [ -L "$TARGET/current" ]; then previous="$(readlink -f "$TARGET/current")"; fi

          release="$TARGET/releases/$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::12}"
          mkdir -p "$release"
          git archive HEAD | tar -x -C "$release"
          if [ ! -f "$release/.cicd/start.sh" ]; then
            echo "Missing .cicd/start.sh in the repo (must start the app on \$PORT)." >&2
            exit 1
          fi
          if [ -f "$release/.cicd/post-deploy.sh" ]; then
            (cd "$release" && bash .cicd/post-deploy.sh)
          fi

          switch_to() { ln -sfn "$1" "$TARGET/.current.tmp"; mv -Tf "$TARGET/.current.tmp" "$TARGET/current"; }
          restart_and_wait() {
            sudo -n /usr/bin/systemctl restart "$SERVICE" || return 1
            for _ in $(seq 30); do
              up=1
              for p in $ports; do ss -ltnH "sport = :$p" | grep -q . || up=0; done
              if [ "$up" = 1 ]; then return 0; fi
              sleep 1
            done
            return 1
          }

          switch_to "$release"
          if restart_and_wait; then
            echo "Live on port(s) $ports: $release"
            exit 0
          fi
          systemctl status "$SERVICE" --no-pager || true
          if [ -n "$previous" ]; then
            switch_to "$previous"
            restart_and_wait || true
            echo "App did not start on port(s) $ports; rolled back to $previous" >&2
          fi
          exit 1
      - name: Remove old releases
        run: |
          ls -1d "$TARGET"/releases/*/ | sort | head -n -"$KEEP_RELEASES" | xargs -r rm -rf -- \
            || echo "Warning: some old releases could not be removed."
